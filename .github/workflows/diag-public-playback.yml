name: diag-public-playback

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, linux, cotas-pruebas]
    steps:
      - name: Diagnose upstream reachability and auth path
        run: |
          set -eu
          python3 - <<'PY'
          import http.client, json, socket, urllib.parse, urllib.request

          def tcp(host, port, timeout=3):
              try:
                  with socket.create_connection((host, port), timeout=timeout):
                      return "open"
              except Exception as e:
                  return f"closed:{type(e).__name__}"

          def http_get(url, timeout=12):
              u = urllib.parse.urlparse(url)
              conn_cls = http.client.HTTPSConnection if u.scheme == "https" else http.client.HTTPConnection
              port = u.port or (443 if u.scheme == "https" else 80)
              try:
                  conn = conn_cls(u.hostname, port, timeout=timeout)
                  conn.request(
                      "GET",
                      u.path + (f"?{u.query}" if u.query else ""),
                      headers={"User-Agent": "cotas-diag", "Accept": "*/*"},
                  )
                  r = conn.getresponse()
                  body = r.read(120)
                  return r.status, r.getheader("Location"), r.getheader("Content-Type"), len(body)
              except Exception as e:
                  return f"err:{type(e).__name__}", None, None, 0

          print("tcp", {
              "10.10.0.100:80": tcp("10.10.0.100", 80),
              "192.141.98.91:80": tcp("192.141.98.91", 80),
              "192.141.98.18:80": tcp("192.141.98.18", 80),
              "192.141.98.18:443": tcp("192.141.98.18", 443),
          })

          live = "http://10.10.0.100/live/10200000/10200000/3537.m3u8"
          st, loc, ctype, n = http_get(live)
          print("lan_live", st, "loc_host=", urllib.parse.urlparse(loc).hostname if loc else None, "ctype=", ctype)
          if loc:
              abs_loc = urllib.parse.urljoin(live, loc)
              print("follow_public", http_get(abs_loc))
              p = urllib.parse.urlparse(abs_loc)
              lan_auth = f"http://10.10.0.100{p.path}"
              print("lan_auth_same_path", http_get(lan_auth))
              router_auth = f"http://192.141.98.18{p.path}"
              print("router_auth_same_path", http_get(router_auth))

          req = urllib.request.Request(
              "http://127.0.0.1:3100/api/v1/auth/login",
              data=json.dumps({"username": "10200000", "password": "10200000"}).encode(),
              method="POST",
              headers={"Content-Type": "application/json", "Accept": "application/json"},
          )
          with urllib.request.urlopen(req, timeout=20) as res:
              token = json.load(res)["accessToken"]
          req2 = urllib.request.Request(
              "http://127.0.0.1:3100/api/v1/playback/authorizations",
              data=json.dumps({"contentType": "live", "streamId": "3537"}).encode(),
              method="POST",
              headers={
                  "Content-Type": "application/json",
                  "Accept": "application/json",
                  "Authorization": f"Bearer {token}",
              },
          )
          try:
              with urllib.request.urlopen(req2, timeout=30) as res:
                  print("authorize", res.status, json.load(res).get("streamUrl", "")[:80])
          except urllib.error.HTTPError as e:
              print("authorize", e.code, e.read().decode()[:300])

          # container name guess
          import subprocess
          try:
              names = subprocess.check_output(["docker", "ps", "--format", "{{.Names}}"], text=True)
              print("containers", names.replace("\n", ","))
          except Exception as e:
              print("docker_ps_error", e)
          PY
