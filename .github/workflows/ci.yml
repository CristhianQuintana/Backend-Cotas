name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cotas
          POSTGRES_PASSWORD: local_only_dev_password
          POSTGRES_DB: cotas_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cotas -d cotas_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run scan:secrets
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=critical
      - run: npm test
      - run: npm run test:e2e
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://cotas:local_only_dev_password@127.0.0.1:5432/cotas_dev
      - run: npm run test:integration
        env:
          RUN_DB_INTEGRATION: "true"
          DATABASE_URL: postgresql://cotas:local_only_dev_password@127.0.0.1:5432/cotas_dev
      - run: npm run build
