name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cotas
          POSTGRES_PASSWORD: local_only_dev_password
          POSTGRES_DB: cotas_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cotas -d cotas_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://cotas:local_only_dev_password@127.0.0.1:5432/cotas_dev
      - run: npm run test:integration
        env:
          RUN_DB_INTEGRATION: "true"
          DATABASE_URL: postgresql://cotas:local_only_dev_password@127.0.0.1:5432/cotas_dev
      - run: npm run build
